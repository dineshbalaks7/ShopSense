[project]
name = "ml-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dinesh Bala KS", email = "dineshbala@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ml-model = "ml_model:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
